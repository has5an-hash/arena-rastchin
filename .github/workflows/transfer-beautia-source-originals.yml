name: Transfer exact Beautia source originals

on:
  push:
    paths:
      - '.github/workflows/transfer-beautia-source-originals.yml'

permissions:
  contents: write

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Download and verify exact originals
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          python3 - <<'PY'
          import hashlib, json, pathlib, urllib.request, subprocess

          API='https://api.firestorage.ai/dev/file'
          SHARE='4HagFOs2qxaq'
          DEST=pathlib.Path('10-PRODUCTS/BEAUTIA/source-originals')
          EXPECTED=[
            ('PROJECT-HANDOFF-FA.md',38758,'af6ab70188323dc8492df28b448ac2e69f3b9261b96d9c9caef5f904e5379734'),
            ('QA-AUDITS-CONSOLIDATED.json',46529,'7de1814c24556b28ded67ce246310f3a7502c13f888ab606a4ba13bf3b9438db'),
            ('راهنمای-فنی-کامل.md',20147,'137a7ac0260ae6fd326c8cc3ed3c7e683cbf48ecd3be4fbfebc3afaf1d10e2bf'),
          ]

          def api_json(url, method='GET'):
              req=urllib.request.Request(
                  url,
                  data=(b'' if method=='POST' else None),
                  method=method,
                  headers={'User-Agent':'github-actions/arena-rastchin'}
              )
              with urllib.request.urlopen(req, timeout=60) as r:
                  return json.loads(r.read().decode())

          listing=api_json(f'{API}/shares/{SHARE}/files?maxResults=1000')
          by_name={x['fileName']:x for x in listing.get('files',[])}
          DEST.mkdir(parents=True,exist_ok=True)

          for name,size_expected,sha_expected in EXPECTED:
              meta=by_name.get(name)
              if not meta:
                  raise SystemExit(f'MISSING {name}')
              ticket=api_json(f"{API}/shares/{SHARE}/files/{meta['fileId']}/download",method='POST')
              url=ticket['downloadUrl']
              target=DEST/name
              h=hashlib.sha256(); size=0
              req=urllib.request.Request(url,headers={'User-Agent':'github-actions/arena-rastchin'})
              with urllib.request.urlopen(req,timeout=120) as r,target.open('wb') as out:
                  while True:
                      chunk=r.read(1024*1024)
                      if not chunk: break
                      out.write(chunk); h.update(chunk); size+=len(chunk)
              digest=h.hexdigest()
              print(name,size,digest)
              if size!=size_expected or digest!=sha_expected:
                  raise SystemExit(f'VERIFY FAILED {name}')
              subprocess.run(['git','add','--',str(target)],check=True)

          subprocess.run(['git','commit','-m','Add exact original Beautia source documents'],check=True)
          subprocess.run(['git','push'],check=True)
          print('EXACT_ORIGINALS_TRANSFERRED')
          PY
