name: Probe firestorage download

on:
  push:
    paths:
      - '.github/workflows/probe-firestorage.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect firestorage client bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, urllib.request
          base='https://firestorage.ai'
          path='/_next/static/chunks/app/(files)/ja/f/page-4d19ae0a4ce39d79.js'
          req=urllib.request.Request(base+path, headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req, timeout=30) as r:
              raw=r.read()
              print('status', r.status, 'url', r.geturl(), 'bytes', len(raw), 'type', r.headers.get('content-type'))
          s=raw.decode('utf-8','replace')
          print('HEAD',repr(s[:500]))
          for pat in ['download','api/','shareId','publicId','signed','presign','fileId','share','token']:
              print('\n###',pat)
              for m in list(re.finditer(re.escape(pat),s,re.I))[:40]:
                  a=max(0,m.start()-250); b=min(len(s),m.end()+450)
                  print(s[a:b].replace('\n',' '))
          PY
