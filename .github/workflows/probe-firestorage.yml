name: Transfer verified RTL-Theme binaries

on:
  push:
    paths:
      - '.github/workflows/probe-firestorage.yml'

permissions:
  contents: write

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download, verify and commit official RTL-Theme files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess, urllib.request

          API='https://api.firestorage.ai/dev/file'
          SHARE='9QLDK4hUhMHx'
          DEST=pathlib.Path('02-RTL-THEME-OFFICIAL')
          EXPECTED = [
              {
                  'name': 'مرجع-ویدیوهای-راستچین.zip',
                  'size': 59280537,
                  'sha256': '2218149ef06e032a11777614cad8e2146c373532b8c36f1797c80557c1e0788d',
              },
              {
                  'name': 'راهنمای لایسنس گذاری راستچین.webm',
                  'size': 60768704,
                  'sha256': '29a59962a0d9fcc8fc2dc2c7393c1306e7a9f1a1fcfb4485e655285816612a96',
              },
              {
                  'name': 'ویدیوی آموزش کامل تمام نکات مهم برای فروشندگی افزونه و قالب در راستچین.mp4',
                  'size': 93572239,
                  'sha256': 'bdd9d3ee14f5887978f7e61abded143abe445772866bf147b752feca17d6a90f',
              },
          ]

          def api_json(url, method='GET'):
              req=urllib.request.Request(
                  url,
                  data=(b'' if method == 'POST' else None),
                  method=method,
                  headers={'User-Agent':'github-actions/arena-rastchin-transfer'}
              )
              with urllib.request.urlopen(req, timeout=60) as r:
                  return json.loads(r.read().decode('utf-8'))

          listing=api_json(f'{API}/shares/{SHARE}/files?maxResults=1000')
          files=listing.get('files') or []
          by_name={x.get('fileName'):x for x in files}
          print('Firestorage files:', [x.get('fileName') for x in files])

          DEST.mkdir(parents=True, exist_ok=True)

          for item in EXPECTED:
              name=item['name']
              meta=by_name.get(name)
              if not meta:
                  raise SystemExit(f'MISSING in Firestorage listing: {name}')
              file_id=meta.get('fileId')
              if not file_id:
                  raise SystemExit(f'MISSING fileId: {name}')

              target=DEST / name
              if target.exists():
                  raw=target.read_bytes()
                  size=len(raw)
                  digest=hashlib.sha256(raw).hexdigest()
                  if size == item['size'] and digest == item['sha256']:
                      print(f'ALREADY VERIFIED {target} {size} {digest}')
                      continue

              ticket=api_json(f'{API}/shares/{SHARE}/files/{file_id}/download', method='POST')
              download_url=ticket.get('downloadUrl')
              if not download_url:
                  raise SystemExit(f'NO downloadUrl returned for {name}')

              print(f'DOWNLOAD {name} fileId={file_id}')
              req=urllib.request.Request(download_url, headers={'User-Agent':'github-actions/arena-rastchin-transfer'})
              h=hashlib.sha256()
              size=0
              with urllib.request.urlopen(req, timeout=300) as r, target.open('wb') as out:
                  while True:
                      chunk=r.read(1024*1024)
                      if not chunk:
                          break
                      out.write(chunk)
                      h.update(chunk)
                      size += len(chunk)
              digest=h.hexdigest()
              print(f'VERIFY {target} size={size} sha256={digest}')
              if size != item['size']:
                  target.unlink(missing_ok=True)
                  raise SystemExit(f'SIZE MISMATCH {name}: {size} != {item["size"]}')
              if digest != item['sha256']:
                  target.unlink(missing_ok=True)
                  raise SystemExit(f'SHA256 MISMATCH {name}: {digest} != {item["sha256"]}')

              subprocess.run(['git','add','--',str(target)],check=True)
              if subprocess.run(['git','diff','--cached','--quiet']).returncode == 0:
                  print(f'NO CHANGE {target}')
                  continue
              subprocess.run(['git','commit','-m',f'Add verified official RTL-Theme asset: {name}'],check=True)
              subprocess.run(['git','push'],check=True)
              print(f'PUSHED {target}')

          print('ALL THREE RTL-THEME FILES VERIFIED AND PUSHED')
          PY
