name: Validate Beautia transferred artifacts

on:
  push:
    paths:
      - '.github/workflows/beautia-transfer.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: true

      - name: Validate LFS and Beautia artifact hashes
        shell: bash
        run: |
          set -euo pipefail
          git lfs fsck
          python3 - <<'PY'
          import hashlib, pathlib
          expected={
            '10-PRODUCTS/BEAUTIA/archives/beautia-nail-sanitized.zip':(108964494,'8d1d680f8636d2fc784d41b4f0b72c1ca088a2079b811e6c21e73b660b95e609'),
            '10-PRODUCTS/BEAUTIA/archives/beautia-source-current.zip':(50064947,'1f5b957a5f3540d266edf4b313c2be88806ae3509bf09cabb71685537b247fce'),
            '10-PRODUCTS/BEAUTIA/archives/beautia-databases-sanitized.zip':(212850,'a61a6c07552b28a3d8fec7a6e47ff278da6a28460db5c560222feaa9d08108bc'),
            '10-PRODUCTS/BEAUTIA/beautia-docs-complete.zip':(484251,'6e715a5c9189e306e65bf2995261cdb27c7ab010f44d77ea90e5dca7448f0a64'),
            '10-PRODUCTS/BEAUTIA/docs/FULL-FILE-MANIFEST.csv':(3725515,'880646d1901b276860d1fcb61c43827868a6d557a89e680b2981a31b05700675'),
          }
          for name,(size,digest) in expected.items():
              p=pathlib.Path(name)
              raw=p.read_bytes()
              got=hashlib.sha256(raw).hexdigest()
              print(f'VERIFIED {name} size={len(raw)} sha256={got}')
              assert len(raw)==size,(name,len(raw),size)
              assert got==digest,(name,got,digest)
          source=[p for p in pathlib.Path('10-PRODUCTS/BEAUTIA/source').rglob('*') if p.is_file()]
          print('SOURCE TREE FILES',len(source))
          assert len(source)==293
          print('BEAUTIA FRESH-CHECKOUT VALIDATION PASSED')
          PY
